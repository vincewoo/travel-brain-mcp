# Fly.io staging application.
app = "travel-brain-mcp"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  MCP_AUTH_MODE = "supabase_oauth"
  PUBLIC_BASE_URL = "https://travel-brain-mcp.fly.dev"
  # Keep this synchronized with the app name above; add custom domains if used.
  ALLOWED_HOSTS = "travel-brain-mcp.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "stop"
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "10s"
    method = "GET"
    timeout = "5s"
    path = "/health"

    [http_service.checks.headers]
      Host = "travel-brain-mcp.fly.dev"

[[vm]]
  size = "shared-cpu-1x"
